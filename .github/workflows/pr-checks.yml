name: PR Checks

# Gate 0 of the release gates (devops/docs + QA pack 04-RELEASE-GATES.md).
# Runs on every PR into main or develop. Nothing here needs a real Firebase
# project: config validation is static, and the rules tests run against the
# Firebase Emulator Suite.
#
# Path convention: these workflows live at the REPOSITORY ROOT (.github/workflows),
# so every path below is root-relative (mobile/, admin-panel/, functions/, devops/).

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  config-validate:
    name: Validate Firebase + DevOps config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # JSON validity. Guarded so a PR that has not merged every workspace yet
      # still produces a usable signal instead of a "file not found" crash.
      - name: JSON validity
        run: |
          set -euo pipefail
          for f in firebase.json firestore.indexes.json .firebaserc \
                   mobile/eas.json mobile/app.json mobile/package.json \
                   admin-panel/package.json functions/package.json; do
            if [ -f "$f" ]; then
              printf 'checking %s\n' "$f"
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
            else
              printf '::warning::skipping missing %s\n' "$f"
            fi
          done

      # Existing preflight script, preserved and extended (see devops/scripts/validate.py):
      # JSON/YAML parse, leaked-secret scan, workflow location, Vite output-path and
      # env-prefix consistency, and that every `npm run <script>` referenced by a
      # workflow actually exists in the owning package.json.
      - name: DevOps preflight (devops/scripts/validate.py)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 devops/scripts/validate.py

  rules-tests:
    name: Security rules unit tests (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a Java process. Without this the emulator
      # never boots and every rules test fails with a confusing timeout.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm i -g firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Fail early if the rules test harness is missing
        working-directory: functions
        run: |
          set -euo pipefail
          for f in test/jest.config.rules.js test/tsconfig.rules.json \
                   test/rules/firestore.rules.test.ts test/rules/storage.rules.test.ts; do
            [ -f "$f" ] || { printf '::error::missing rules test harness file: functions/%s\n' "$f"; exit 1; }
          done

      # `test:rules` wraps the run in `firebase emulators:exec --only firestore,storage,auth`,
      # so this single command starts the emulators, loads the ROOT firestore.rules /
      # storage.rules, runs the suites, and shuts everything down again.
      - name: Run security rules unit tests
        working-directory: functions
        run: npm run test:rules

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-emulator-log-${{ github.run_id }}
          path: |
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7

  mobile-checks:
    name: Mobile — types, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # mobile/ has no package-lock.json in the assembled tree, so `npm ci`
      # would fail outright. Use it when a lockfile exists, otherwise install.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: TypeScript (tsc --noEmit)
        run: |
          if node -e "process.exit(require('./package.json').scripts.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            npx tsc --noEmit
          fi

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "no lint script — skipping"
          fi

      - name: Unit tests (L1 — pure logic + static contract)
        run: |
          if node -e "process.exit(require('./package.json').scripts.test ? 0 : 1)"; then
            npm test -- --ci --coverage --passWithNoTests
          else
            echo "::warning::no test script in mobile/package.json — skipping"
          fi

  admin-checks:
    name: Admin panel — build, env + bundle guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Guard 1 — env prefix. vite.config.js exposes VITE_* to the client, so a
      # REACT_APP_* name in the build env simply never reaches import.meta.env.
      # If these drift, isConfigured=false and the panel silently ships in
      # demo/mock mode. Read the prefix straight out of the source of truth.
      - name: Env prefix must match what the source actually reads
        run: |
          set -euo pipefail
          PREFIX=$(grep -ohE 'import\.meta\.env\.([A-Z0-9_]+)' src/services/firebase.js \
                   | sed -E 's/import\.meta\.env\.([A-Z]+)_.*/\1/' | sort -u | head -n 1)
          echo "detected env prefix: ${PREFIX:-<none>}"
          [ -n "$PREFIX" ] || { echo "::error::could not detect an env prefix in src/services/firebase.js"; exit 1; }
          if grep -rIl 'REACT_APP_' src/ .env.example 2>/dev/null; then
            echo "::error::REACT_APP_* found in the admin panel, but the source reads ${PREFIX}_* — production would fall back to demo mode."
            exit 1
          fi
          echo "env prefix consistent: ${PREFIX}_*"

      - name: Production build
        run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_FIREBASE_PROJECT_ID: photobooth-app-staging
          VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY || 'staging-placeholder-key' }}
          VITE_EXPECTED_PROJECT_ID: photobooth-app-staging

      # Guard 2 — build output layout. firebase.json hosting.public and every CI
      # scan path must follow whatever vite.config.js build.outDir produces.
      - name: Verify Vite output layout matches firebase.json
        working-directory: .
        run: |
          set -euo pipefail
          PUBLIC=$(node -e "const c=require('./firebase.json');const h=Array.isArray(c.hosting)?c.hosting[0]:c.hosting;process.stdout.write(h.public)")
          echo "firebase.json hosting.public = $PUBLIC"
          [ -d "$PUBLIC" ] || { echo "::error::$PUBLIC does not exist — Vite build.outDir and firebase.json hosting.public disagree"; exit 1; }
          [ -d "$PUBLIC/assets" ] || { echo "::error::$PUBLIC/assets missing — Vite emitted an unexpected layout"; exit 1; }
          echo "build layout ok: $PUBLIC/assets"

      # Guard 3 — secret scan against the REAL Vite output directory (build/assets),
      # not the Create-React-App path build/static/js, which does not exist here.
      - name: Fail if a real key leaked into the bundle
        working-directory: .
        run: |
          set -euo pipefail
          PUBLIC=admin-panel/build
          if grep -rIlE 'AIzaSy[A-Za-z0-9_\-]{30,}|sk_live_[A-Za-z0-9]{10,}|r8_[A-Za-z0-9]{20,}|-----BEGIN (RSA )?PRIVATE KEY-----' "$PUBLIC" ; then
            echo "::error::A live-looking secret string was found in the admin bundle."
            exit 1
          fi
          echo "bundle secret scan clean"

  functions-checks:
    name: Cloud Functions — build, unit tests, callable contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: TypeScript build
        run: npm run build

      - name: Unit tests (rules suites excluded — those need the emulator job)
        run: npm test

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [config-validate, rules-tests, mobile-checks, admin-checks, functions-checks]
    if: always()
    steps:
      - run: |
          {
            echo "### PR checks"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| config-validate | ${{ needs.config-validate.result }} |"
            echo "| rules-tests | ${{ needs.rules-tests.result }} |"
            echo "| mobile-checks | ${{ needs.mobile-checks.result }} |"
            echo "| admin-checks | ${{ needs.admin-checks.result }} |"
            echo "| functions-checks | ${{ needs.functions-checks.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"