name: Android — Build APK

# Libreng APK build (walang EAS, walang EXPO_TOKEN, walang bayad na build credit).
# Direktang Gradle build ito sa GitHub runner: `expo prebuild` -> `./gradlew assembleRelease`.
#
# Patakbuhin: Actions tab -> "Android — Build APK" -> Run workflow
# O awtomatiko sa bawat push sa `main` na may pagbabago sa mobile/.
#
# Output: APK na madodownload sa ilalim ng "Artifacts" ng run.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Optional upload keystore. Kung naka-set ang base64 secret, gagamitin ito
      # para sa totoong release signing. Kung wala, ang default (debug keystore)
      # na signing ng Expo template ang gagamitin — installable pa rin ang APK.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      GRADLE_TASK: ${{ (github.event.inputs.build_type == 'debug') && 'assembleDebug' || 'assembleRelease' }}
      APK_DIR: ${{ (github.event.inputs.build_type == 'debug') && 'debug' || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package.json

      - name: Setup Java (JDK ${{ env.JAVA_VERSION }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # `npm_config_workspaces=false` para manatili sa mobile/node_modules ang
      # install at maiwasan ang hoisting issue ng npm workspaces sa Metro/Expo.
      - name: Install mobile dependencies
        working-directory: mobile
        env:
          npm_config_workspaces: 'false'
        run: |
          npm install --no-audit --no-fund
          if [ ! -d node_modules/expo ]; then
            echo "::error::Hindi ma-install ang expo sa mobile/node_modules"
            exit 1
          fi
          node -e "require.resolve('expo/package.json'); console.log('expo resolved OK')"

      - name: Ensure Expo assets exist (prebuild prerequisite)
        working-directory: mobile
        run: node scripts/ci-ensure-assets.mjs

      - name: Prebuild (generate native android/ project)
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Inject upload keystore (kapag may secrets)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: mobile
        run: node scripts/ci-inject-signing.mjs

      - name: Build APK (${{ env.GRADLE_TASK }})
        working-directory: mobile/android
        env:
          # Optional: gawing konektado ang APK sa Firebase mo gamit ang repo Variables.
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
        run: |
          chmod +x ./gradlew
          ./gradlew "$GRADLE_TASK" --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        working-directory: mobile
        run: |
          set -euo pipefail
          APK_PATH=$(find "android/app/build/outputs/apk/${APK_DIR}" -type f -name '*.apk' | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Walang APK na na-generate sa android/app/build/outputs/apk/${APK_DIR}"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-android-${{ env.GRADLE_TASK }}-${{ github.sha }}
          path: mobile/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### 📦 APK na-build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Gradle task | \`$GRADLE_TASK\` |"
            echo "| File | \`${{ steps.apk.outputs.name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Artifact | \`photobooth-android-$GRADLE_TASK-${{ github.sha }}\` |"
            echo ""
            echo "I-download sa **Artifacts** section sa ilalim ng page na ito."
          } >> "$GITHUB_STEP_SUMMARY"
